services:
  server:
    build:
      context: .
    environment:
      NODE_ENV: production
    ports:
      - 5173:5173
    restart: always
    command: npm run app
  web:
    image: nginx:alpine
    ports:
      - "80:80"
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

